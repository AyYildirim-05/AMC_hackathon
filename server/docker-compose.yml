# Local stack for the Express + MongoDB backend.
#
#   docker compose up -d mongo     MongoDB only (run the server on the host with `npm run dev`)
#   docker compose up -d --build   MongoDB + Express (:4000)

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  express:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/app
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
    ports:
      - '4000:4000'

volumes:
  mongo-data:
